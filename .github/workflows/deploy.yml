name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # yufeng-wiki 内容更新时由该仓库的 workflow 触发（repository_dispatch），
  # 也可手动触发
  repository_dispatch:
    types: [content-updated]
  # yufeng-wiki 没有跨仓库触发的 token，先用每日定时兜底：内容推送后公开站
  # 最迟次日跟上；着急就 workflow_dispatch 手动触发。（论文墙不进公开站，
  # 改海报不需要在这里重新构建。）
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell (with engines)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mount public content
        run: |
          git clone --depth 1 https://github.com/YufengJin/yufeng-wiki.git src/content/notes
          # 公开站只有公开笔记。另外两样都是私有仓库，刻意不 clone：
          #   vault（yufeng-vault）   —— /vault/ 不存在于公开站
          #   论文墙（yufeng-papers） —— /papers/ 不存在于公开站
          # 没有挂载 = 没有那些字节，页面、卡片、导航、搜索记录一并不存在
          # （src/lib/papers.ts、src/content.config.ts），check-privacy.mjs 兜底。

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          HUB_SITE: https://yufengjin.github.io
          HUB_BASE: /yufeng-hub

      - name: Content checks (dialect + wikilinks)
        run: pnpm check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
